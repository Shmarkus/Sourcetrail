name: Build and Test

# Every push builds, tests and packages. Pushes to master refresh the rolling `latest` prerelease;
# a pushed `v*` tag publishes a release of that version. Other branches only keep the run artifact.
on: [push]

permissions:
  contents: read

jobs:
  build:
    # The oldest supported runner: the package needs the glibc it was built against.
    runs-on: ubuntu-22.04
    env:
      ST_TOOLCHAIN: /home/runner/.cache/sourcetrail-toolchain
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          # The xcb and wayland libraries are what the bundled Qt plugins link against; bundleLibraries.sh copies them.
          sudo apt-get install -y --no-install-recommends gcc-13 g++-13 lld ninja-build patchelf imagemagick file \
            libgl1-mesa-dev libegl1 libfontconfig1 libdbus-1-3 libglib2.0-0 libgssapi-krb5-2 \
            libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-xfixes0 libxcb-xkb1 \
            libwayland-client0 libwayland-cursor0 libwayland-egl1
          # The presets and the Conan profile call plain gcc/g++.
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-13 130 --slave /usr/bin/g++ g++ /usr/bin/g++-13
          case "$(gcc -dumpversion)" in 13*) ;; *) echo "gcc is $(gcc -dumpversion), not 13" >&2; exit 1 ;; esac
          case "$(g++ -dumpversion)" in 13*) ;; *) echo "g++ is $(g++ -dumpversion), not 13" >&2; exit 1 ;; esac
          # The runner image ships a current Maven; the distribution's is older.
          command -v mvn > /dev/null || sudo apt-get install -y --no-install-recommends maven
          gcc --version
          mvn --version

      # The C/C++ indexer builds against LLVM/Clang 19 from apt.llvm.org (bin/app/data/cxx/include holds Clang 19's
      # builtin headers); the package bundles libclang-cpp.so.19 and libLLVM.so.19.
      - name: Install LLVM 19
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/jammy/ llvm-toolchain-jammy-19 main" |
            sudo tee /etc/apt/sources.list.d/llvm-19.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-19 llvm-19-dev libclang-19-dev libclang-cpp19-dev
          /usr/lib/llvm-19/bin/llvm-config --version

      - name: Configure Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # The TypeScript and Python indexer runs on Node (22.13 or newer: node:sqlite without a flag); CMake stages it with npm
      # (scip-python included), and its tests run on node. The Python tests use the runner's python3 for a virtualenv.
      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Not setup-java's own Maven cache: it globs the whole checkout and fails (ELOOP) on the self-referencing
      # symlinks under bin/test/data, even with cache-dependency-path set.
      - name: Cache the Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('java_indexer/pom.xml') }}

      - name: Cache the toolchain (Qt, Conan packages)
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.ST_TOOLCHAIN }}
          # bootstrap.sh pins the Qt, Conan and aqt versions.
          key: st-toolchain-ubuntu-22.04-gcc13-${{ hashFiles('conan.lock', '.conan/gcc/profile', 'scripts/fork/bootstrap.sh') }}

      - name: Install the toolchain
        run: |
          scripts/fork/bootstrap.sh > /dev/null
          if [ "${{ steps.toolchain-cache.outputs.cache-hit }}" != "true" ]; then
            # Keep the cache to the built packages; their build trees are large.
            eval "$(scripts/fork/bootstrap.sh --env)"
            conan cache clean "*" --build --source --download --temp
          fi

      - name: Configure CMake
        run: |
          eval "$(scripts/fork/bootstrap.sh --env)"
          cmake --preset fork_release_cxx

      - name: Build
        run: |
          eval "$(scripts/fork/bootstrap.sh --env)"
          cmake --build --preset fork_release_cxx -j "$(nproc)"
          # LLVM 19 and the C/C++ build take about 3 GB more than before; this shows how close the runner gets.
          df -h /

      - name: Test
        run: |
          eval "$(scripts/fork/bootstrap.sh --env)"
          mkdir -p "$RUNNER_TEMP/home"
          HOME="$RUNNER_TEMP/home" QT_QPA_PLATFORM=offscreen ctest --preset fork_release_cxx

      - name: Test the TypeScript and Python indexer
        run: |
          npm ci --prefix tools/ts-indexer --no-audit --no-fund
          node --test tools/ts-indexer

      - name: Package
        run: ./setup/Linux/createPackages.sh build/fork-release-cxx

      - name: Smoke test the packaged st
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          tar -xzf Sourcetrail_Linux_64bit.tar.gz -C "$RUNNER_TEMP/package"
          # The release package has C/C++: the libraries are in it, and ST_SMOKE_REQUIRE_CXX fails a skipped C/C++ section.
          ls "$RUNNER_TEMP/package/Sourcetrail/lib/"libclang-cpp.so.19* "$RUNNER_TEMP/package/Sourcetrail/lib/"libLLVM.so.19*
          ST_SMOKE_REQUIRE_CXX=1 testing/cli/st-smoke.sh "$RUNNER_TEMP/package/Sourcetrail/bin/st"

      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Sourcetrail_Linux_64bit
          path: ./Sourcetrail_Linux_64bit.tar.gz

  release:
    needs: build
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: Sourcetrail_Linux_64bit

      - name: Refresh the latest prerelease
        if: github.ref == 'refs/heads/master'
        run: |
          NOTES="Built from master at $GITHUB_SHA. Includes the GUI and st, with Java, TypeScript, Python and C/C++ indexing."
          if gh release view latest > /dev/null 2>&1; then
            # Update in place: move the tag, replace the package, rewrite the notes.
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/latest" -f sha="$GITHUB_SHA" -F force=true > /dev/null
            gh release upload latest Sourcetrail_Linux_64bit.tar.gz --clobber
            gh release edit latest --notes "$NOTES"
          else
            gh release create latest Sourcetrail_Linux_64bit.tar.gz --target "$GITHUB_SHA" --prerelease \
              --title "Latest master build" --notes "$NOTES"
          fi

      - name: Publish the tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release create "$GITHUB_REF_NAME" Sourcetrail_Linux_64bit.tar.gz --verify-tag \
            --title "Sourcetrail $GITHUB_REF_NAME" --generate-notes
